# ═══════════════════════════════════════════════════════════════
# Fimbulwinter Lite — server-side-first QoL for Valheim 1.0
#
# Local branch (lite-minimal), pinned at 2.0.0. Do not tag, do not
# push to main, do not publish to Thunderstore.
#
# If the server can do it, the server does it -- players install as
# little as possible and console/vanilla clients are never locked out.
# ═══════════════════════════════════════════════════════════════

[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "ibfleming"
name = "Fimbulwinter_Lite"
description = "Server-side-first QoL for Valheim 1.0. Most of the QoL runs on the dedicated server so clients stay near-vanilla."
versionNumber = "2.0.0"
websiteUrl = "https://github.com/ibfleming/fimbulwinter-lite"

[package.dependencies]

# ── Loader + shared libraries (both sides) ─────────────────────
denikson-BepInExPack_Valheim = "5.4.2350"
ValheimModding-YamlDotNet = "16.3.1"
shudnal-ConditionalConfigSync = "1.0.5"

# ── Client UI / QoL ───────────────────────────────────────────
shudnal-MyLittleUI = "1.2.18"
shudnal-ExtraSlots = "1.2.3"
Toxo-CraftFromChests = "0.4.0"
Neobotics-HUDCompass = "1.2.0"
JoelOliMclean-NoRainDamage = "1.3.0"
korCaptain-NullReferenceFix = "1.0.20"
JereKuusela-Server_devcommands = "1.113.0"
Crystal-DeathPenalty = "1.3.0"
cjayride-RecycleItemsIntoParts = "1.7.3"

# ── Server-side only (never shipped to clients) ────────────────
# Mirrored by SERVER_ONLY_MODS in scripts/export-profile.sh.
ArgusMagnus-ServersideQoL = "2.0.7"
ArgusMagnus-ServersideQoL_AutoStore = "2.0.0"
ArgusMagnus-ServersideQoL_ContainerSizes = "2.0.1"
ArgusMagnus-ServersideQoL_AutoProcess = "2.0.0"
ArgusMagnus-ServersideQoL_LetItFloat = "2.0.4"
ArgusMagnus-ServersideQoL_JustSleep = "2.0.0"
ArgusMagnus-ServersideQoL_MultiplayerTweaks = "2.0.0"

[publish]
communities = ["valheim"]

[publish.categories]
valheim = ["modpacks", "tweaks", "server-side"]

[build]

[[build.copy]]
source = "config"
target = "config"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"
