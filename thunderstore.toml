# ═══════════════════════════════════════════════════════════════
# Fimbulwinter Vanilla — BepInEx-only bootstrap (branch: vanilla)
#
# TEMPORARY / LOCAL ONLY. This is NOT a published modpack release.
# It exists so we can play Valheim 1.0.0 together on the dedicated
# server with a loader present but zero gameplay mods, and then add
# mods back incrementally as they ship 1.0-compatible updates.
#
# Do not tag, do not push to main, do not publish to Thunderstore.
# ═══════════════════════════════════════════════════════════════

[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "ibfleming"
name = "Fimbulwinter_Lite"
description = "Vanilla + BepInEx bootstrap for Valheim 1.0.0. No gameplay mods -- just the loader, so mods can be layered back on as they update."
versionNumber = "1.0.0"
websiteUrl = "https://github.com/ibfleming/fimbulwinter-lite"

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2350"

[publish]
communities = ["valheim"]

[publish.categories]
valheim = ["modpacks", "tweaks", "server-side"]

[build]

[[build.copy]]
source = "config"
target = "config"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"
