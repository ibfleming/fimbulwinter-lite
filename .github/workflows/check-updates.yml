name: Check Mod Updates

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  check-updates:
    name: Check Thunderstore Updates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # scripts/update-mods.sh writes updates_available / update_list to
      # GITHUB_OUTPUT and a report to GITHUB_STEP_SUMMARY on its own.
      - name: Check for mod updates
        id: check
        run: make updates

      - name: Create or update tracking issue
        if: steps.check.outputs.updates_available != '0' && steps.check.outputs.updates_available != ''
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_LIST: ${{ steps.check.outputs.update_list }}
        run: bash scripts/ci-update-issue.sh
