## Settings file for Crystal-DeathPenalty (dev.crystal.deathpenalty)
## All values are AlwaysServerControlled via ConditionalConfigSync -- the server copy wins.
## Change with scripts/deploy.sh configs, not by editing a client profile.

[Death]

## Percent of every skill's level lost on death. 0 disables skill loss, 50 halves all
## skills, 100 resets them. Vanilla is 5. This pack runs combat hard (150% enemy damage,
## 85% player damage) on a fresh world, where 5% compounds harshly; the old pack's
## SmartSkills landed at roughly 1.25% effective but was paired with combat veryhard.
## 2 keeps "death matters but is not crushing": a level-30 skill loses ~0.6 levels.
SkillLossPercent = 2

## Seconds of the post-death "No Skill Loss" effect that blocks further loss from
## chained deaths. Vanilla default is 600 (10 min). Left at vanilla.
MercyEffectDuration = 600

## Seconds of the "Corpse Run" effect granted on looting your tombstone. Vanilla
## default is 50. Left at vanilla.
SafetyEffectDuration = 50

## Whether partial progress toward each skill's next level is wiped on death, on top
## of the level loss. Vanilla default is true. Left at vanilla -- the percent above
## is the single deliberate dial here.
ResetLevelProgress = true
